<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="DiffWise — engineering review that shows its work">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="glowLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridLight" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e3e8ee" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bgLight)"/>
  <rect width="1280" height="300" fill="url(#gridLight)" opacity="0.7"/>
  <rect x="0" y="0" width="520" height="300" fill="url(#glowLight)"/>
  <rect x="0.5" y="0.5" width="1279" height="299" fill="none" stroke="#d8dee4"/>

  <!-- product mark -->
  <g transform="translate(72 86) scale(2)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <path d="M20 16v32" stroke="#0969da" stroke-width="4" stroke-linecap="round"/>
    <path d="M28 22h16M28 32h11M28 42h20" stroke="#1f2328" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="47" cy="22" r="5" fill="#1a7f37"/>
    <circle cx="42" cy="42" r="4" fill="#8250df"/>
  </g>

  <!-- wordmark -->
  <text x="216" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#0d1117" letter-spacing="-1.5">DiffWise</text>
  <text x="218" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#57606a">Engineering review that shows its work</text>

  <!-- interface chips -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g>
      <rect x="218" y="196" width="76" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="234" y="218" fill="#1f2328">CLI</text>
    </g>
    <g>
      <rect x="302" y="196" width="118" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="318" y="218" fill="#1f2328">VS Code</text>
    </g>
    <g>
      <rect x="428" y="196" width="86" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="444" y="218" fill="#1f2328">MCP</text>
    </g>
    <g>
      <rect x="522" y="196" width="62" height="34" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <text x="538" y="218" fill="#1f2328">CI</text>
    </g>
  </g>

  <!-- shared core card: what every interface consumes -->
  <g transform="translate(872 58)" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="336" height="184" rx="12" fill="#ffffff" stroke="#d8dee4"/>
    <rect x="0" y="0" width="4" height="184" rx="2" fill="#0969da" opacity="0.85"/>
    <text x="24" y="34" font-size="12.5" font-weight="700" fill="#4b5563" letter-spacing="1.4">SHARED CORE</text>
    <g font-size="15">
      <circle cx="30" cy="64" r="4" fill="#1a7f37"/>
      <text x="48" y="69" fill="#1f2328">diff · symbols · graph</text>
      <circle cx="30" cy="94" r="4" fill="#1a7f37"/>
      <text x="48" y="99" fill="#1f2328">deterministic rules</text>
      <circle cx="30" cy="124" r="4" fill="#9a6700"/>
      <text x="48" y="129" fill="#1f2328">reviewers · verification</text>
      <circle cx="30" cy="154" r="4" fill="#0969da"/>
      <text x="48" y="159" fill="#1f2328">one report contract</text>
    </g>
    <text x="24" y="178" font-size="12.5" fill="#6e7781">local-first · AI optional</text>
  </g>
</svg>
