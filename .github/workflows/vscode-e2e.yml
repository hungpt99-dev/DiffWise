name: VS Code end-to-end

# Manual workflow: it downloads a real VS Code build, runs it on a virtual
# display and drives the Extension Development Host over CDP.
on:
  workflow_dispatch:

jobs:
  vscode-e2e:
    name: Extension Development Host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node demo/build-demo-repo.mjs --target /tmp/diffwise-demo

      - name: Install VS Code and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64
          curl -sL -o /tmp/vscode.deb "https://update.code.visualstudio.com/latest/linux-deb-x64/stable"
          sudo apt-get install -y /tmp/vscode.deb

      - name: Seed a review through the CLI
        # Proves the CLI -> VS Code direction: the extension restores this report
        # on activation and the webview must render it.
        run: |
          cd /tmp/diffwise-demo
          node "$GITHUB_WORKSPACE/packages/cli/bin/diffwise.js" init
          node "$GITHUB_WORKSPACE/packages/cli/bin/diffwise.js" review main..HEAD --no-ai || true

      - name: Launch the Extension Development Host
        run: |
          Xvfb :99 -screen 0 1920x1200x24 &
          sleep 2
          DISPLAY=:99 code --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir=/tmp/dw-vscode --extensions-dir=/tmp/dw-ext \
            --remote-debugging-port=9222 \
            --extensionDevelopmentPath="$PWD/apps/vscode" /tmp/diffwise-demo &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:9222/json/list >/dev/null && break
            sleep 2
          done

      - name: Run the smoke test
        env:
          DIFFWISE_E2E_SHOTS: docs/screenshots
        run: node e2e/vscode/run-vscode-e2e.mjs

      - name: Review from the command palette, then read it with the CLI
        # Proves the VS Code -> CLI direction: a review started in the editor must
        # be the same persisted review the CLI can list.
        env:
          DIFFWISE_E2E_WORKSPACE: /tmp/diffwise-demo
        run: |
          cd /tmp/diffwise-demo
          printf '\n// e2e change\nexport const e2eMarker = 1;\n' >> src/api/routes.ts
          cd "$GITHUB_WORKSPACE"
          node e2e/vscode/trigger-review.mjs
          cd /tmp/diffwise-demo
          node "$GITHUB_WORKSPACE/packages/cli/bin/diffwise.js" history --limit 1 --json | tee /tmp/history.json
          node -e "const h=require('/tmp/history.json'); if(!h.reviews?.length) { console.error('no review recorded'); process.exit(1); }" 

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-e2e
          path: docs/screenshots/vscode-e2e.png
          if-no-files-found: ignore
