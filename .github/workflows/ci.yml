name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The workspaces type against built declarations (`dist/index.d.ts`), so a
      # cold clone must build before it can typecheck. Doing this in the other
      # order is why CI reported "Cannot find module '@diffwise/core'" on every
      # run from 0.3.0 onwards.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Browser UI end-to-end
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e

      - name: Package the extension
        run: npm run package:vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: diffwise-vsix
          path: apps/vscode/*.vsix
          if-no-files-found: error

      - name: Upload UI test artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-e2e
          path: tmp/e2e-webview.png
          if-no-files-found: ignore
