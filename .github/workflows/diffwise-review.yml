name: DiffWise review

# Engineering review gate: produces SARIF for code scanning and a JSON report
# artefact, and fails only when the configured quality gate is hit.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: diffwise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review the change
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Deterministic by default. Add a DIFFWISE_API_KEY secret and set
      # DIFFWISE_AI=on to let the review use a model as well.
      DIFFWISE_AI: 'off'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the review needs the merge base, not a shallow clone

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Write review configuration
        run: |
          mkdir -p .diffwise
          printf '%s\n' '{"qualityGate":{"failOn":"high"},"ai":{"enabled":false},"verification":{"command":"npm test"}}' > .diffwise/config.json

      # To bound model spend, configure `pricing` in .diffwise/config.json and
      # add `--max-cost 0.50` to the command below (exit code 10 = ceiling hit).
      - name: Review the pull request
        id: review
        run: |
          set +e
          node packages/cli/bin/diffwise.js review \
            --base "origin/${{ github.base_ref }}" --head HEAD \
            --format sarif --out diffwise.sarif --no-input --no-ai
          code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          # 0 = clean, 1 = quality gate hit. Anything else is an operational failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi

      - name: Write the JSON envelope
        if: always()
        run: |
          node packages/cli/bin/diffwise.js report latest --format json --out diffwise-report.json || true

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('diffwise.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: diffwise.sarif
          category: diffwise

      - name: Upload report artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diffwise-report
          path: |
            diffwise.sarif
            diffwise-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce the quality gate
        if: steps.review.outputs.exit-code == '1'
        run: |
          echo "::error title=DiffWise review::Findings at or above the configured threshold were detected. See the uploaded report."
          exit 1
